<div class="modal-header">
  <h4 class="modal-title">
    {{ contact ? 'Editar contacto' : 'Agregar contacto' }}
  </h4>

  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()">
  </button>
</div>

<div class="modal-body">

  @if (error) {
    <div class="alert alert-danger">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="save()">

    <div class="mb-3">
      <label class="form-label">Tipo de contacto</label>

      <select
        class="form-select"
        [(ngModel)]="form.contactType"
        name="contactType"
        (change)="changeType()">

        @for (type of types; track type.value) {
          <option [ngValue]="type.value">
            @if (type.value === 'Person') {
              Persona
            }

            @if (type.value === 'PublicOrganization') {
              Organización pública
            }

            @if (type.value === 'PrivateOrganization') {
              Organización privada
            }
          </option>
        }

      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Nombre</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="form.name"
        name="name"
        placeholder="Ingrese el nombre">
    </div>

    <div class="mb-3">
      <label class="form-label">Teléfono</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="form.phoneNumber"
        name="phoneNumber"
        placeholder="Ingrese el teléfono">
    </div>

    <div class="mb-3">
      <label class="form-label">Comentarios</label>

      <textarea
        class="form-control"
        [(ngModel)]="form.comments"
        name="comments"
        rows="3"
        placeholder="Ingrese comentarios"></textarea>
    </div>

    @if (form.contactType === 'Person') {

      <div class="mb-3">
        <label class="form-label">Nombre</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.firstName"
          name="firstName"
          placeholder="Ingrese el nombre">
      </div>

      <div class="mb-3">
        <label class="form-label">Apellido</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.lastName"
          name="lastName"
          placeholder="Ingrese el apellido">
      </div>

    }

    @if (form.contactType === 'PublicOrganization') {

      <div class="mb-3">
        <label class="form-label">Sector gubernamental</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.governmentSector"
          name="governmentSector"
          placeholder="Ingrese el sector gubernamental">
      </div>

      <div class="mb-3">
        <label class="form-label">Sitio web</label>

        <input
          type="url"
          class="form-control"
          [(ngModel)]="form.website"
          name="website"
          placeholder="https://ejemplo.com">
      </div>

    }

    @if (form.contactType === 'PrivateOrganization') {

      <div class="mb-3">
        <label class="form-label">Sector o industria</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.industry"
          name="industry"
          placeholder="Ingrese la industria">
      </div>

      <div class="mb-3">
        <label class="form-label">Sitio web</label>

        <input
          type="url"
          class="form-control"
          [(ngModel)]="form.website"
          name="website"
          placeholder="https://ejemplo.com">
      </div>

    }

  </form>

</div>

<div class="modal-footer">

  <button
    type="button"
    class="btn btn-secondary"
    (click)="activeModal.dismiss()">
    Cancelar
  </button>

  <button
    type="button"
    class="btn btn-primary"
    [disabled]="saving"
    (click)="save()">

    {{ saving ? 'Guardando...' : 'Guardar' }}

  </button>

</div>
